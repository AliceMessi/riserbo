<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="430" fill="#ffffff"/>
  <!-- host boundary -->
  <rect x="20" y="20" width="920" height="300" rx="10" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="44" font-weight="600">Your machine / on-premise server (docker compose)</text>

  <!-- browser -->
  <rect x="50" y="90" width="170" height="90" rx="8" fill="#f7f7f5" stroke="#999"/>
  <text x="135" y="125" text-anchor="middle" font-weight="600">Browser</text>
  <text x="135" y="147" text-anchor="middle" fill="#555">localhost:8080</text>
  <text x="135" y="166" text-anchor="middle" fill="#555">mapping kept in page</text>

  <!-- app -->
  <rect x="290" y="70" width="290" height="220" rx="8" fill="#fff" stroke="#d52b1e" stroke-width="2"/>
  <text x="435" y="98" text-anchor="middle" font-weight="600">Riserbo app (FastAPI)</text>
  <rect x="310" y="112" width="250" height="38" rx="5" fill="#fff1b8"/>
  <text x="435" y="136" text-anchor="middle">1 · Rules: AHV, IBAN, UID, CF, P.IVA…</text>
  <rect x="310" y="158" width="250" height="38" rx="5" fill="#fbd3d3"/>
  <text x="435" y="182" text-anchor="middle">2 · Apertus: people, orgs, QUASI, health</text>
  <rect x="310" y="204" width="250" height="38" rx="5" fill="#dfe7fb"/>
  <text x="435" y="228" text-anchor="middle">3 · Merge + placeholders [PERSON_1]</text>
  <rect x="310" y="248" width="250" height="32" rx="5" fill="#d7f0e3"/>
  <text x="435" y="269" text-anchor="middle">4 · Restore answers locally</text>

  <!-- llm -->
  <rect x="660" y="90" width="250" height="150" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="785" y="118" text-anchor="middle" font-weight="600">llama.cpp server</text>
  <text x="785" y="142" text-anchor="middle">Apertus 1.5 8B · Q4_K_M GGUF</text>
  <text x="785" y="164" text-anchor="middle" fill="#555">JSON-schema output</text>
  <text x="785" y="200" text-anchor="middle" fill="#d52b1e" font-weight="600">internal network:</text>
  <text x="785" y="220" text-anchor="middle" fill="#d52b1e" font-weight="600">no internet access</text>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
  <line x1="220" y1="125" x2="288" y2="125" stroke="#111" marker-end="url(#a)"/>
  <line x1="288" y1="155" x2="222" y2="155" stroke="#111" marker-end="url(#a)"/>
  <line x1="560" y1="177" x2="658" y2="160" stroke="#111" marker-end="url(#a)"/>
  <line x1="658" y1="180" x2="562" y2="190" stroke="#111" marker-end="url(#a)"/>

  <!-- outside -->
  <rect x="300" y="350" width="360" height="60" rx="8" fill="#f7f7f5" stroke="#999"/>
  <text x="480" y="376" text-anchor="middle" font-weight="600">Any cloud AI (outside, optional)</text>
  <text x="480" y="396" text-anchor="middle" fill="#555">receives only placeholders — copied by the user</text>
  <line x1="135" y1="180" x2="300" y2="370" stroke="#999" stroke-dasharray="4 4" marker-end="url(#a)"/>
</svg>
